<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="1200" viewBox="0 0 1640 1200">
<rect width="1640" height="1200" fill="#FAF8F4"/>
<text x="40" y="61" font-family="Segoe UI,Arial,sans-serif" font-size="36" font-weight="700" fill="#1F2A44" text-anchor="start">B: VM per lab</text>
<text x="40" y="99" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#59677A" text-anchor="start">Same research capability and controls; different lab and administrative boundaries</text>
<g id="people"><rect x="40" y="130" width="310" height="84" fill="#EEF1F5" stroke="#CAD0DA" stroke-width="2"/>
<text x="195.0" y="165.0" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#1F2A44" text-anchor="middle">People</text>
<text x="195.0" y="196.0" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#1F2A44" text-anchor="middle">Lab UI / shell / editor</text>
</g>
<g id="operator"><rect x="400" y="130" width="860" height="84" fill="#FFF0D8" stroke="#A56815" stroke-width="2"/>
<text x="830.0" y="165.0" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#1F2A44" text-anchor="middle">Infrastructure operator control</text>
<text x="830.0" y="196.0" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#1F2A44" text-anchor="middle">Works independently of a responsive research agent</text>
</g>
<g id="host"><rect x="40" y="265" width="1220" height="670" fill="none" stroke="#CAD0DA" stroke-width="3"/></g>
<text x="56" y="300" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#59677A" text-anchor="start">Qualified VM host / provider</text>
<g id="lab"><rect x="70" y="325" width="1160" height="480" fill="none" stroke="#3D4FB0" stroke-width="3"/></g>
<text x="86" y="360" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#3D4FB0" text-anchor="start">Lab A VM: own guest kernel and Engine</text>
<g id="ui"><rect x="100" y="385" width="260" height="70" fill="#E8EDF9" stroke="#3D4FB0" stroke-width="2"/>
<text x="230.0" y="429.0" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#1F2A44" text-anchor="middle">Lab interface</text>
</g>
<g id="shell"><rect x="390" y="385" width="200" height="70" fill="#EEF1F5" stroke="#CAD0DA" stroke-width="2"/>
<text x="490.0" y="427.5" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#1F2A44" text-anchor="middle">Lab VM shell</text>
</g>
<g id="runtime"><rect x="100" y="500" width="490" height="180" fill="#E8EDF9" stroke="#3D4FB0" stroke-width="2"/>
<text x="345.0" y="553.0" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#1F2A44" text-anchor="middle">Complete lab AI4R, version A</text>
<text x="345.0" y="583.0" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#1F2A44" text-anchor="middle">Intent / planning / research / checking</text>
<text x="345.0" y="613.0" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#1F2A44" text-anchor="middle">Knowledge / capability library</text>
<text x="345.0" y="643.0" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#1F2A44" text-anchor="middle">CC factory / RSI</text>
</g>
<g id="supervisor"><rect x="650" y="385" width="540" height="70" fill="#FFF0D8" stroke="#A56815" stroke-width="2"/>
<text x="920.0" y="428.0" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#1F2A44" text-anchor="middle">VM supervisor + own Docker Engine</text>
</g>
<text x="650" y="480" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#A56815" text-anchor="start">Only the controller holds Engine authority</text>
<g id="cc"><rect x="650" y="510" width="245" height="130" fill="#E8EDF9" stroke="#3D4FB0" stroke-width="2"/>
<text x="772.5" y="553.0" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#1F2A44" text-anchor="middle">Containerized CCs</text>
<text x="772.5" y="583.0" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#1F2A44" text-anchor="middle">Vendored tool parts</text>
<text x="772.5" y="613.0" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#1F2A44" text-anchor="middle">and dependencies</text>
</g>
<g id="apps"><rect x="945" y="510" width="245" height="130" fill="#E8EDF9" stroke="#3D4FB0" stroke-width="2"/>
<text x="1067.5" y="553.5" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#1F2A44" text-anchor="middle">Domain applications</text>
<text x="1067.5" y="582.5" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#1F2A44" text-anchor="middle">Library, batch or</text>
<text x="1067.5" y="611.5" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#1F2A44" text-anchor="middle">stateful service</text>
</g>
<g id="data"><rect x="100" y="720" width="1090" height="62" fill="#E4F3EC" stroke="#2C7A59" stroke-width="2"/>
<text x="645.0" y="758.5" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#1F2A44" text-anchor="middle">Persistent lab data: knowledge, accepted artifacts, jobs and application state</text>
</g>
<g id="peers"><rect x="70" y="840" width="1160" height="66" fill="#EEF1F5" stroke="#CAD0DA" stroke-width="2"/>
<text x="650.0" y="880.5" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#1F2A44" text-anchor="middle">Other lab VMs: their own guest kernels, Engines, AI4R versions and data</text>
</g>
<text x="1310" y="296" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#1F2A44" text-anchor="start">Shared services</text>
<text x="1310" y="328" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#59677A" text-anchor="start">Same or different machine</text>
<g id="inference"><rect x="1310" y="385" width="290" height="90" fill="#EEF1F5" stroke="#CAD0DA" stroke-width="2"/>
<text x="1455.0" y="423.0" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#1F2A44" text-anchor="middle">Shared inference</text>
<text x="1455.0" y="452.0" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#1F2A44" text-anchor="middle">Authenticated endpoint</text>
</g>
<g id="images"><rect x="1310" y="530" width="290" height="90" fill="#EEF1F5" stroke="#CAD0DA" stroke-width="2"/>
<text x="1455.0" y="568.0" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#1F2A44" text-anchor="middle">Image / artifact source</text>
<text x="1455.0" y="596.0" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#1F2A44" text-anchor="middle">Selected pinned packages</text>
</g>
<g id="backup"><rect x="1310" y="720" width="290" height="90" fill="#E4F3EC" stroke="#2C7A59" stroke-width="2"/>
<text x="1455.0" y="758.0" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#1F2A44" text-anchor="middle">Independent backup</text>
<text x="1455.0" y="787.0" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#1F2A44" text-anchor="middle">Verified restore input</text>
</g>
<polyline points="195,214 195,242 25,242 25,420 100,420" fill="none" stroke="#59677A" stroke-width="2"/>
<polygon points="100,420 90,415 90,425" fill="#59677A"/>
<text x="40" y="238" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#59677A" text-anchor="start">primary connection</text>
<polyline points="350,172 370,172 370,238 610,238 610,420 590,420" fill="none" stroke="#59677A" stroke-width="2" stroke-dasharray="8 6"/>
<polygon points="590,420 600,415 600,425" fill="#59677A"/>
<text x="400" y="235" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#59677A" text-anchor="start">direct access</text>
<polyline points="230,455 230,500" fill="none" stroke="#59677A" stroke-width="2"/>
<polygon points="230,500 225,490 235,490" fill="#59677A"/>
<polyline points="590,550 620,550 620,420 650,420" fill="none" stroke="#3D4FB0" stroke-width="2"/>
<polygon points="650,420 640,415 640,425" fill="#3D4FB0"/>
<polyline points="772,455 772,510" fill="none" stroke="#A56815" stroke-width="2"/>
<polygon points="772,510 767,500 777,500" fill="#A56815"/>
<polyline points="895,575 945,575" fill="none" stroke="#59677A" stroke-width="2"/>
<polygon points="945,575 935,570 935,580" fill="#59677A"/>
<polyline points="345,680 345,720" fill="none" stroke="#2C7A59" stroke-width="2"/>
<polygon points="345,720 340,710 350,710" fill="#2C7A59"/>
<polyline points="1065,640 1065,720" fill="none" stroke="#2C7A59" stroke-width="2"/>
<polygon points="1065,720 1060,710 1070,710" fill="#2C7A59"/>
<polyline points="1190,420 1310,420" fill="none" stroke="#59677A" stroke-width="2" stroke-dasharray="8 6"/>
<polygon points="1310,420 1300,415 1300,425" fill="#59677A"/>
<text x="1200" y="409" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#59677A" text-anchor="start">model API</text>
<polyline points="1310,575 1278,575 1278,440 1190,440" fill="none" stroke="#59677A" stroke-width="2" stroke-dasharray="8 6"/>
<polygon points="1190,440 1200,435 1200,445" fill="#59677A"/>
<polyline points="1190,751 1310,751" fill="none" stroke="#2C7A59" stroke-width="2" stroke-dasharray="8 6"/>
<polygon points="1310,751 1300,746 1300,756" fill="#2C7A59"/>
<polyline points="830,214 830,250 1220,250 1220,348" fill="none" stroke="#A56815" stroke-width="2"/>
<polygon points="1220,348 1215,338 1225,338" fill="#A56815"/>
<text x="1030" y="242" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#A56815" text-anchor="start">start / stop lab</text>
<text x="650" y="681" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#A56815" text-anchor="start">Cancel experiment / normal lab stop:</text>
<text x="650" y="707" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#A56815" text-anchor="start">stop owned work, observe status, retain data</text>
<text x="40" y="980" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#1F2A44" text-anchor="start">Operator-controlled lifecycle paths</text>
<g id="restart"><rect x="40" y="1002" width="385" height="94" fill="#FFF0D8" stroke="#A56815" stroke-width="2"/>
<text x="232.5" y="1042.0" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#1F2A44" text-anchor="middle">Stopped → restart</text>
<text x="232.5" y="1072.0" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#1F2A44" text-anchor="middle">Reconcile before dispatch</text>
</g>
<g id="delete"><rect x="455" y="1002" width="385" height="94" fill="#FFF0D8" stroke="#A56815" stroke-width="2"/>
<text x="647.5" y="1042.0" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#1F2A44" text-anchor="middle">Separate delete request</text>
<text x="647.5" y="1072.0" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#1F2A44" text-anchor="middle">Explicit data disposition</text>
</g>
<g id="emergency"><rect x="870" y="1002" width="390" height="94" fill="#FFF0D8" stroke="#A56815" stroke-width="2"/>
<text x="1065.0" y="1042.0" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#1F2A44" text-anchor="middle">Emergency: stop the VM</text>
<text x="1065.0" y="1071.0" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#1F2A44" text-anchor="middle">Host / provider confirms state</text>
</g>
<g id="shared-stays"><rect x="1310" y="1002" width="290" height="94" fill="#EEF1F5" stroke="#CAD0DA" stroke-width="2"/>
<text x="1455.0" y="1042.0" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#1F2A44" text-anchor="middle">Other labs and shared</text>
<text x="1455.0" y="1070.0" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#1F2A44" text-anchor="middle">services stay running*</text>
</g>
<text x="40" y="1141" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#59677A" text-anchor="start">*Designed scoped stop. Host failure can affect co-located labs; remote effects may need cancellation/reconciliation.</text>
<text x="40" y="1177" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#59677A" text-anchor="start">Design comparison only. No shutdown, isolation, restore or performance trial was run.</text>
</svg>