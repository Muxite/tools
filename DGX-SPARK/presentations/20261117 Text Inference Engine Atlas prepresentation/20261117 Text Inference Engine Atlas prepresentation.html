<main id="canvas" tabindex="-1"></main><script id="dataset" type="application/json">{"muse":{"refs":[{"title":"Published text configuration defaults","url":"https://github.com/huggingface/transformers/blob/fd3cf0140de03f7619ac95b5cfed05b711ff9e22/src/transformers/models/muse_spark/configuration_muse_spark.py#L117","detail":"Reference defaults include 62 decoder layers, hidden width 8192, 128 Q heads, 16 KV heads, head size 64, 256 experts and eight routed picks. These values describe the public config class. Load the authorized pack’s actual config before allocating or selecting kernels."},{"title":"Muse Spark Open model card","url":"https://huggingface.co/meta-models/Muse-Spark-Open-816B-A42B/tree/0fb02478b02565b2ce7fc57e6051c91172774ac9","detail":"The public model identity is 816B total / 42B active. The workshop did not qualify a particular gated checkpoint, tokenizer revision or memory representation."},{"title":"Reference router formula","url":"https://github.com/huggingface/transformers/blob/fd3cf0140de03f7619ac95b5cfed05b711ff9e22/src/transformers/models/muse_spark/modeling_muse_spark.py#L194","detail":"Compute FP32 router projection and multiply by output_multiplier. Apply sigmoid. Rank by score plus e_score_correction_bias, gather unbiased scores, divide by their sum plus 1e−15 and multiply by routed_scaling_factor."},{"title":"SGLang fused Muse router","url":"https://github.com/sgl-project/sglang/blob/1aa45c661758b2ff99dc8c57ec849175ab4625ed/python/sglang/srt/models/muse_spark.py#L639","detail":"The operator binds correction bias, output multiplier, normalization epsilon and route scale. A specialization must preserve the reference’s expert membership and aligned weights."},{"title":"SGLang router fixtures","url":"https://github.com/sgl-project/sglang/blob/1aa45c661758b2ff99dc8c57ec849175ab4625ed/test/registered/kernels/ops/moe/test_muse_spark_routing.py#L36","detail":"Upstream fixtures exercise (256,8) and (128,4). Test-case shapes describe the kernel suite and do not set checkpoint geometry."},{"title":"SGLang routed-only model guard","url":"https://github.com/sgl-project/sglang/blob/1aa45c661758b2ff99dc8c57ec849175ab4625ed/python/sglang/srt/models/muse_spark.py#L478","detail":"Muse’s OSS SGLang MoE rejects a nonzero num_shared_experts. Its forward path uses routed FFNs. An independent shared branch belongs to a different model contract."},{"title":"Expert activation and post-norm","url":"https://github.com/huggingface/transformers/blob/fd3cf0140de03f7619ac95b5cfed05b711ff9e22/src/transformers/models/muse_spark/modeling_muse_spark.py#L240","detail":"Compute gate/up projections, activation product and down projection. Apply input-scaled RMSNorm to each expert output before multiplying its route weight and accumulating by original token row."},{"title":"Expert input and output projections","url":"https://github.com/huggingface/transformers/blob/fd3cf0140de03f7619ac95b5cfed05b711ff9e22/src/transformers/models/muse_spark/modeling_muse_spark.py#L255","detail":"Router reads input at model width. A separate pre-expert projection and centered norm prepare expert-width inputs. Post-expert projection returns the combined output to model width."},{"title":"Centered and input-scaled RMSNorm","url":"https://github.com/huggingface/transformers/blob/fd3cf0140de03f7619ac95b5cfed05b711ff9e22/src/transformers/models/muse_spark/modeling_muse_spark.py#L126","detail":"Centered RMSNorm normalizes then multiplies by 1 + learned weight. Input-scaled RMSNorm scales and rounds to input dtype before its reduction. Swapping those stages changes the result."},{"title":"Reference decoder boundaries","url":"https://github.com/huggingface/transformers/blob/fd3cf0140de03f7619ac95b5cfed05b711ff9e22/src/transformers/models/muse_spark/modeling_muse_spark.py#L474","detail":"Apply attention pre-norm, attention, post-norm and learned residual gate. Repeat the corresponding boundary around the FFN. The stream handed to the next block includes both gated tity","reads"],["startup/place","state/weight","bound tensor placement by tier","writes"],["host/discover","startup/reserve","usable device and memory limits","returns"],["startup/warm","interface/accept","ready model and execution context","returns"],["interface/submit","schedule/queue","sequence descriptor or cancellation","calls"],["schedule/admit","state/allocate","KV capacity reservation","calls"],["schedule/slot","state/reuse","compatible prefix and state handles","reads"],["schedule/batch","generate/prefill","ragged prompt spans, offsets and positions","calls"],["schedule/batch","generate/step","decode rows, slot mapping and positions","calls"],["generate/prefill","model/embed","prompt token IDs for forward pass","calls"],["generate/step","model/embed","last committed token IDs for forward pass","calls"],["model/head","generate/filter","next-token vocabulary logits","returns"],["generate/commit","interface/detok","committed output IDs and terminal status","returns"],["generate/commit","schedule/advance","accepted tokens and continuation decision","returns"],["schedule/advance","state/release","retired or cancelled sequence generation","calls"],["generate/verify","state/recurrent","committed length and rollback point","writes"],["model/kv","state/append","K/V vectors, logical positions and physical slots","writes"],["model/attend","state/append","K/V for visible positions","reads"],["model/ready","state/fill","authoritative expert ID and placement","calls"],["model/qkv","backend/gemm","dense projection operands and shape","calls"],["model/route","backend/row","scores or table indices and selector contract","calls"],["model/attend","backend/attn","Q, KV view, mask and scale","calls"],["model/expert","backend/gemm","grouped expert rows and weight handles","calls"],["model/combine","backend/row","inverse indices, expert outputs and mixture weights","calls"],["backend/lower","state/scratch","temporary buffer requirements and liveness","calls"],["backend/streams","host/device","launches, copies and synchronization events","calls"],["backend/signal","state/release","last-use completion fence","returns"],["interface/mounts","startup/manifest","mounted checkpoint root","reads"],["backend/signal","interface/diagnostics","runtime events and NVTX annotations","returns"]],"engine":[{"id":"startup","title":"L0 · Startup","summary":"At process startup, validate the checkpoint and tokenizer, bind tensor storage, reserve state and run a warm-up request. The request handler receives a ready engine handle.","ops":[{"id":"config","group":"Configuration","title":"Validate model and device settings","detail":"Resolve model revision, tokenizer identity, context limit, compute precision, target devices and memory budgets against supported options. A deployed binary receives architecture choices from checkpoint metadata and validated overrides.","check":"Reject mismatched tokenizer/model identities and unsupported head geometry before serving.","metric":"Configuration failures and elapsed time to validated configuration.","cc":["model.decoder_architecture","placement.partition_model"],"bindings":["model.identify_architecture"],"target":true,"essential":true},{"id":"manifest","group":"Model assets","title":"Read tensor inventory","detail":"Read checkpoint headers or shard indexes. Check byte ranges, tensor shapes, strides, quantization block sizes, aliases and model-specific name mappings before binding a tensor handle.","check":"Reject a truncated shard, incompatible block dimension or missing gate tensor. Verify intentionally tied tensors remain valid.","metric":"Header scan time, bytes read, peak resident bytes during load.","cc":["weights.load_checkpoint"],"bindings":["weights.read_gguf","weights.validate_shapes","weights.select_loader"],"target":true,"essential":true},{"id":"layout","group":"Model assets","title":"Prepare weight layouts","detail":"Select a checkpoint representation the execution backend accepts. When repacking or converting, bind block metadata, scales, axes and padded dimensions to the layout used by the consuming kernel. Prepared packs may be supplied offline.","check":"Round-trip representative full blocks, tails and signed extremes against the declared source representation.","metric":"Pack build time and size; first-use repack time if done at startup.","cc":["weights.prepare_artifact","weights.decode_blocks"],"bindings":["weights.repack_for_kernel","weights.convert_checkpoint","weights.configure_quantization"],"target":true,"essential":false},{"id":"bind","group":"Model assets","title":"Bind Muse text-model assets","detail":"Bind model weights, text tokenizer, generation settings and prompt template to one revision. Check gating weights, correction bias, expert tensors, normalization gains and vocabulary projection. A template or tokenizer mismatch changes the first layer’s input.","check":"Exercise a known prompt and compare token IDs and logits to the reference with the selected adapter active.","metric":"Time to bind model and tokenizer; adapter load bytes.","cc":["weights.load_checkpoint","weights.adapter_binding","tokenizer.prepare_request"],"bindings":["weights.bind_tensors","weights.bind_adapters"],"target":true,"essential":true},{"id":"place","group":"Device bring-up","title":"Assign weights and devices","detail":"Choose layer, tensor or expert partitioning using usable capacity, access costs, available ranks and the required working set. Associate logical tensor slices with local storage and device identifiers.","check":"Validate all required tensor slices and a viable miss path for every nonresident expert.","metric":"Persistent bytes per tier and estimated transit bytes per invocation.","cc":["placement.partition_model","engine.expert_streaming","parallel.model_execution"],"bindings":["placement.partition_layers","placement.map_weights"],"target":true,"essential":true},{"id":"reserve","group":"Device bring-up","title":"Reserve state and backend workspace","detail":"Initialize device contexts, communicators when required, KV storage, scheduler slots, scratch arenas and stream/event pools. Leave headroom for peak concurrent requests.","check":"Start with minimum and maximum supported budgets. Verify failure occurs before partially published readiness.","metric":"Reserved versus committed bytes; per-device high-water mark.","cc":["memory.runtime_arenas","memory.sequence_kv","backend.execute_operators"],"bindings":["memory.plan_workspace","backend.register"],"target":true,"essential":true},{"id":"warm","group":"Device bring-up","title":"Warm up and report ready","detail":"Run representative shapes to populate lazy allocations and optional compiled or captured graphs. Publish readiness after the production request path succeeds. Record which shapes remain cold.","check":"Start a clean process, issue first and second requests, and compare outputs and first-use costs.","metric":"Process-start to ready, ready to first token and cold/warm deltas.","cc":["graph.lower_capture_replay","serving.request_gateway","observability.runtime_events"],"bindings":["serving.bootstrap","graph.capture_replay"],"target":true,"essential":false}],"edges":[["config","manifest","model revision and schema"],["manifest","layout","tensor descriptors"],["manifest","bind","validated tensor ranges"],["layout","bind","executable weight layout"],["bind","place","model geometry"],["place","reserve","placement and capacity"],["reserve","warm","initialized contexts and arenas"]]},{"id":"interface","title":"L1 · Engine image interface","summary":"The image exposes three surfaces to its callers and operators: text generation over HTTP, filesystem paths bound at launch, and optional diagnostics. One CC owns the external interface across all three.","ops":[{"id":"accept","group":"Input","title":"Serve the completions endpoint","detail":"Bind the configured address and port. For a completions-compatible contract, POST /v1/completions accepts a prompt and returns JSON or an ordered event stream. Validate generation options and propagate cancellation to the scheduler.","check":"Submit invalid parameters, an oversized prompt and a disconnected client. Check deterministic error and cleanup behavior.","metric":"Request arrival rate, rejected requests, parse time.","cc":["serving.request_gateway"],"bindings":["serving.http_api","serving.decode_protocol"],"target":true,"essential":true},{"id":"format","group":"Input","title":"Render the selected prompt template","detail":"Render text messages with the selected Muse tokenizer’s chat template, special markers and role boundaries. Preserve raw prompt mode. Parse tool calls or reasoning text only when that interface is enabled by the contract.","check":"Compare rendered bytes for multi-turn, empty, Unicode and tool-result messages against the model’s reference template.","metric":"Prompt construction time and resulting prompt-token count.","cc":["tokenizer.prepare_request","serving.request_gateway"],"bindings":["tokenizer.render_chat","serving.tool_protocol"],"target":true,"essential":false},{"id":"encode","group":"Input","title":"Encode using the pinned tokenizer","detail":"Apply the tokenizer assets from the selected Muse revision to the rendered prompt. Preserve byte, whitespace and special-token behavior and return the resulting ID sequence to scheduling.","check":"Check boundary-sensitive whitespace, split Unicode, reserved text and special token policies against a frozen tokenizer.","metric":"Tokenizer throughput in prompt tokens/s and elapsed time per request.","cc":["tokenizer.prepare_request"],"bindings":["tokenizer.encode"],"target":true,"essential":true},{"id":"submit","group":"Submission","title":"Submit or cancel","detail":"Submit a sequence descriptor containing token IDs, sampling controls and response channel. Propagate cancellation to scheduling so an in-flight request reaches a single terminal state.","check":"Cancel during queued, prefill, decode and output-backpressure states. Check that teardown is idempotent.","metric":"Accepted-to-enqueued latency, cancellation lag, active streams.","cc":["serving.request_gateway","scheduler.request_lifecycle"],"bindings":["tokenizer.dispatch_requests","scheduler.enqueue"],"target":true,"essential":true},{"id":"detok","group":"Output","title":"Decode committed tokens","detail":"Incrementally decode committed IDs into text while retaining unfinished UTF-8 or tokenizer pieces. Apply stop-string handling across chunk boundaries.","check":"Split multi-byte text and multi-token stop sequences across output chunks; compare final text with single-pass decoding.","metric":"Detokenization time and buffered bytes per stream.","cc":["tokenizer.prepare_request"],"bindings":["output.detokenize"],"target":true,"essential":true},{"id":"emit","group":"Output","title":"Send text deltas and finish reason","detail":"Serialize text deltas, finish reason and optional tool-call fields. Bound buffered output and feed disconnect or backpressure into request ownership.","check":"Verify exactly one finish notification and no emissions after cancellation under a slow reader.","metric":"Client-observed first text and inter-chunk latency; queued output bytes.","cc":["serving.request_gateway"],"bindings":["output.stream","output.structured_response"],"target":true,"essential":true},{"id":"mounts","group":"Image boundary","title":"Resolve mounted paths","detail":"Declare a read-only model root, any writable cache and scratch paths, and an optional diagnostics output directory. The launcher binds host volumes. Resolve paths inside the image and report a missing or unreadable checkpoint before advertising readiness.","check":"Launch with an external read-only checkpoint and a fresh output volume. Repeat with a missing required mount. Observe a specific startup error and an unready service.","metric":"Required paths resolved; readiness and startup outcome.","cc":["serving.request_gateway"],"target":true,"essential":true},{"id":"diagnostics","group":"Image boundary","title":"Expose diagnostic hooks","detail":"Make the supported metrics surface, profiling switches and trace destination discoverable. The observability CC inserts NVTX ranges and defines event names and clocks. An external collector can capture those ranges and write a trace to the agreed destination.","check":"Send the same request with profiling disabled and enabled. Check output parity, correlate request and layer events, and verify that the host can retrieve the trace.","metric":"Trace retrieval, event coverage and capture overhead.","cc":["serving.request_gateway","observability.runtime_events"],"target":true,"essential":false}],"edges":[["accept","format","messages or raw prompt"],["format","encode","prompt bytes and special-token policy"],["encode","submit","token IDs and generation controls"],["accept","submit","already-tokenized embedded request"],["detok","emit","complete text delta"],["emit","submit","disconnect or cancellation signal"],["mounts","accept","validated launch paths and readiness"],["accept","diagnostics","request identity and timing"],["emit","diagnostics","terminal status and response timing"]]},{"id":"schedule","title":"L2 · Scheduling","summary":"At each iteration, choose the prompt spans and decode rows that will run. Publish a batch plan containing tokens, positions, sequence offsets and physical KV write locations.","ops":[{"id":"queue","group":"Admission","title":"Queue requests by service policy","detail":"Track enqueue time, deadlines, requested limits and cancellation. Allocate a durable request identity even when a sequence has no active device slot.","check":"Mix long and short requests with a cancelled head of queue; confirm progress and fair service under the declared policy.","metric":"Waiting requests, queue wait percentiles and arrival rate.","cc":["scheduler.request_lifecycle","observability.runtime_events"],"bindings":["scheduler.enqueue"],"target":true,"essential":true},{"id":"admit","group":"Admission","title":"Admit against capacity","detail":"Check sequence slots, token budget, KV capacity, prefix credit and active worker capacity. Queue, preempt or reject predictably when the contract cannot admit work.","check":"Constrain KV pages and force simultaneous admissions; prove no double assignment or oversubscription.","metric":"Admitted requests/s, wait by reason, capacity stalls.","cc":["scheduler.request_lifecycle","memory.sequence_kv"],"bindings":["scheduler.admit"],"target":true,"essential":true},{"id":"slot","group":"Admission","title":"Bind sequence slot","detail":"Bind request and sequence generation to slot, state handles, prefix match, current position and sampling state. Isolate reused slots from late completions.","check":"Retire then reuse a slot with a delayed callback from the previous sequence.","metric":"Slot occupancy, prefix tokens recovered, per-request reserved bytes.","cc":["scheduler.request_lifecycle","memory.reusable_sessions"],"bindings":["scheduler.assign_slot"],"target":true,"essential":true},{"id":"budget","group":"Iteration","title":"Allocate the iteration’s token budget","detail":"Spend an iteration’s token budget on prompt chunks and active decode tokens. Respect context positions, latency goals and staging capacity when overlapping steps.","check":"Compare logits under chunked and unchunked prompts; verify an outstanding decode request is served under heavy prefill.","metric":"Prompt tokens/step, decode tokens/step, prefill interference and starvation time.","cc":["batch.execution_layout","scheduler.request_lifecycle"],"bindings":["prefill.plan_budget","scheduler.overlap_steps"],"target":true,"essential":true},{"id":"batch","group":"Iteration","title":"Assemble execution batch","detail":"Pack tokens, positions, sequence offsets, output indices, causal metadata and KV slot mappings. Preserve an inverse map to requests across heterogeneous lengths.","check":"Validate ragged lengths, singleton and mixed batches against independent per-request execution.","metric":"Effective tokens/batch, padding ratio, assembly time.","cc":["batch.execution_layout"],"bindings":["batch.assemble"],"target":true,"essential":true},{"id":"advance","group":"Iteration","title":"Commit batch results and release slots","detail":"Read completion and sampled token events, advance committed positions, requeue continuing sequences and release finished or cancelled state when device work is safe.","check":"Interleave completion, cancellation and stop events across two sequences and verify ownership after slot recycling.","metric":"Finished requests/s, step turnaround, state release delay.","cc":["scheduler.request_lifecycle","decode.advance_sequence"],"bindings":["scheduler.retire_requests"],"target":true,"essential":true}],"edges":[["queue","admit","waiting sequence and limits"],["admit","slot","capacity reservation"],["slot","budget","runnable work and state handles"],["budget","batch","selected rows and chunk lengths"],["batch","advance","completion indexed by sequence"],["advance","budget","remaining prompt or next-token work"],["advance","admit","released capacity"]]},{"id":"generate","title":"L3 · Generation loop","summary":"Prefill produces state and first-token logits from the prompt. Each decode step consumes a committed token, appends its state and returns logits for the next token. Finished sequences return to the scheduler for release.","ops":[{"id":"prefill","group":"Prompt","title":"Populate sequence state from prompt tokens","detail":"Submit uncached prompt tokens at their absolute positions with a causal mask and any valid cached prefix. Retain state and the final logits required for the first generated token.","check":"Compare chunked and whole-prompt logits and KV contents for a prefix whose last page is partially full.","metric":"Prefill tokens/s, prefill duration and time to first token under the specified load.","cc":["decode.advance_sequence","memory.sequence_kv","batch.execution_layout"],"bindings":["prefill.sync_prompt"],"target":true,"essential":true},{"id":"handoff","group":"Prompt","title":"Hand off prompt state to decode","detail":"If prefill and decode run on different workers, transfer or share KV blocks, prefix length, layout, sequence identity and completion fences before decode starts.","check":"Inject a missing page and a delayed copy. Require correct retry or failure and reference-equivalent destination logits.","metric":"Handoff bytes, transfer duration and exposed wait before decode.","cc":["parallel.model_execution","memory.sequence_kv"],"condition":"Disaggregated prefill and decode","bindings":["transfer.handoff_prefill"],"target":false,"essential":false},{"id":"step","group":"Iteration","title":"Run one decode step","detail":"Read the last committed token, logical position and prefix state. Run the model and logit head, append that token’s state, and return logits for the following token.","check":"Compare cached decode against recomputing the full prefix at page and window boundaries.","metric":"Inter-token latency and decode tokens/s with active sequences and context lengths recorded.","cc":["decode.advance_sequence","memory.sequence_kv"],"bindings":["decode.step"],"target":true,"essential":true},{"id":"filter","group":"Iteration","title":"Constrain vocabulary logits","detail":"Apply model and request policy in the specified order, including token masks, grammar state, repetition penalties, temperature and sampling truncation. Reject impossible constraints predictably.","check":"Check grammar masks, repetition history, all-masked logits and deterministic greedy behavior at the cutoff boundary.","metric":"Logits processing time, active vocabulary and mask update cost.","cc":["sampling.select_tokens"],"bindings":["sampling.constrain_tokens"],"target":true,"essential":false},{"id":"sample","group":"Iteration","title":"Choose next token","detail":"Choose argmax for greedy mode or sample a normalized distribution with request-owned RNG state. Route any sampled EOS through the model’s token-level stop rules.","check":"Use fixed seeds under batch reordering and exercise top-k, top-p and greedy policies on a known vocabulary.","metric":"Sampler time per emitted token and device-to-host synchronization time.","cc":["sampling.select_tokens"],"bindings":["sampling.draw_tokens"],"target":true,"essential":true},{"id":"commit","group":"Iteration","title":"Commit tokens and test stop conditions","detail":"Advance the accepted token stream and update generation limits, EOS state and stop-sequence buffers. Emit safe committed output and schedule another step if the request remains active.","check":"Stop on EOS, output-length limit and a stop sequence crossing a chunk. Prevent emission of unverified draft tokens.","metric":"Emitted versus computed tokens, host bookkeeping and terminal notification delay.","cc":["decode.advance_sequence","serving.request_gateway"],"bindings":["output.stream","scheduler.retire_requests"],"target":true,"essential":true},{"id":"draft","group":"Speculation","title":"Propose draft tokens","detail":"When selected, a draft model or proposal method extends a temporary prefix. Retain the information required by the verification rule, including proposal probabilities for probabilistic correction when used.","check":"Force a poor proposal and ensure draft state stays isolated from committed state.","metric":"Draft tokens proposed per verification step and draft generation cost.","cc":["decode.speculative_execution"],"condition":"Speculative decoding enabled","bindings":["decode.propose_draft","decode.choose_draft"],"target":false,"essential":false},{"id":"verify","group":"Speculation","title":"Verify drafts and roll back rejected state","detail":"Evaluate target logits over draft positions. Accept a valid prefix according to the selected verifier, emit the target correction when required, then roll KV, positions and any recurrent state back to the commit point.","check":"Check zero, partial and full acceptance. For a stochastic verifier test target-distribution equivalence, not exact greedy equality.","metric":"Accepted tokens per verification, rejected work, rollback time and end-to-end speedup.","cc":["decode.speculative_execution","memory.reusable_sessions"],"condition":"Speculative decoding enabled","bindings":["decode.verify_draft"],"target":false,"essential":false}],"edges":[["prefill","filter","last prompt-position logits"],["prefill","handoff","sealed cache blocks and positions"],["handoff","step","ready destination state + committed next token"],["step","filter","next-token logits"],["filter","sample","eligible vocabulary and scores"],["sample","commit","sampled token ID"],["commit","step","continuing sequence and accepted token"],["commit","draft","committed prefix"],["draft","verify","candidate tokens and proposal metadata"],["verify","commit","verified prefix and correction"]]},{"id":"model","title":"L4 · Model execution","summary":"Muse maps text token IDs through normalized embeddings, repeated attention and FFN blocks, learned residual gates and a scaled vocabulary head. Its routed path applies each expert’s output norm before weighted combination. Full and sliding attention follow the layer configuration.","ops":[{"id":"embed","group":"Decoder","title":"Gather and normalize token embeddings","detail":"Gather the checkpoint embedding row for each text token ID and apply Muse’s weightless embedding RMSNorm before the first decoder layer.","check":"Check repeated and boundary IDs, model scale and tied/untied vocabulary matrices against a reference.","metric":"Bytes gathered, embedding time and hidden-row count.","cc":["model.embedding_service"],"bindings":["model.embedding_lookup","model.layer_embeddings"],"target":true,"essential":true},{"id":"norm","group":"Decoder","title":"Normalize the attention input","detail":"Muse’s centered RMSNorm reduces squared elements in FP32, normalizes by sqrt(mean square + ε), then applies 1 + learned weight. Its separate input-scaled post-norm reverses the scale/reduction order and rounds to the input dtype at the prescribed boundary.","check":"Compare residual and normalized tensors at zero, small and large magnitudes under the declared accumulator dtype.","metric":"Read/write bandwidth, reduction time and achieved fusion at the tested shape.","cc":["model.decoder_architecture"],"bindings":["dense.rms_norm"],"target":true,"essential":true},{"id":"qkv","group":"Attention","title":"Project Q, K and V","detail":"Apply learned projections to hidden rows. Shape the result into query heads and KV heads; grouped- and multi-query attention require the checkpoint’s query-to-KV-head mapping.","check":"Compare projection rows, head strides and grouped head mapping on an odd token count.","metric":"Projection matmul time, bytes of weights read and batching efficiency.","cc":["attention.dense_execution","backend.execute_operators"],"target":true,"essential":true},{"id":"position","group":"Attention","title":"Normalize Q/K and apply layer position rule","detail":"Normalize projected query and key heads. Read the layer’s positional rule: rotate Q/K for a RoPE layer and leave the normalized pair unrotated for NoPE. Use this layer’s actual scale, mask and window.","check":"Compare beyond the initial context range and across a chunk boundary. Verify dimension order and pairing convention.","metric":"Position transform duration and overhead of a separate launch.","cc":["attention.dense_execution"],"bindings":["attention.rotary_position"],"target":true,"essential":true},{"id":"kv","group":"Attention","title":"Append K and V to sequence state","detail":"Map the arriving K/V vectors to the sequence’s physical pages or contiguous slots. Make the appended entries visible to the consuming attention call at the correct causal positions.","check":"Check partial pages, concurrent slots and sliding-window wrap using an independently indexed reference.","metric":"KV bytes appended and read per step, address translation overhead.","cc":["memory.sequence_kv","attention.dense_execution"],"bindings":["memory.kv_slots"],"target":true,"essential":true},{"id":"shortlist","group":"Attention","title":"Select sparse attention blocks","detail":"For a checkpoint with sparse attention, compute index features and candidate scores, select eligible blocks or token positions and gather their KV descriptors with causal bounds.","check":"Use fixtures with known candidate scores, empty candidates, tied cutoffs and partially filled blocks. Compare to the specified sparse selection, not unrestricted dense attention.","metric":"Candidates scored, selected KV bytes and selection cost versus attention cost.","cc":["attention.sparse_execution"],"condition":"Sparse/indexed attention layer","bindings":["attention.score_blocks","attention.shortlist_blocks","attention.sparse_index","attention.gather_sparse_kv"],"target":false,"essential":false},{"id":"attend","group":"Attention","title":"Compute causal attention","detail":"Read query heads and the associated KV heads from the current sequence. Compute scaled QKᵀ under this layer’s full or sliding-window causal mask, normalize over legal keys, then apply those weights to V. The selected Muse configuration determines the active window.","check":"Compare to an explicit small reference for ragged lengths, grouped heads, causal masks and split reductions.","metric":"Prefill compute throughput versus decode KV-read bandwidth; mask and workspace traffic.","cc":["attention.dense_execution","attention.sparse_execution"],"bindings":["attention.masked_softmax","attention.flash_attention","attention.sparse_decode","attention.sparse_prefill","attention.merge_partials"],"target":true,"essential":true},{"id":"attout","group":"Attention","title":"Gate and project attention outputs","detail":"Normalize each attention output head, flatten the head dimension, and multiply elementwise by sigmoid(gate_proj(attention input)). Apply the output projection to produce a branch at model width.","check":"Compare head reassembly and rank partial sums to a single-device reference.","metric":"Projection time and exposed collective latency.","cc":["attention.dense_execution","parallel.model_execution"],"target":true,"essential":true},{"id":"recur","group":"Attention","title":"Advance recurrent layer","detail":"A recurrent or hybrid model can replace attention in selected layers with per-sequence state update or chunked scan. Use the declared state transition, gates and update ordering.","check":"Compare sequential single-token recurrence with chunked prefill and test state restoration after speculative rejection.","metric":"Scan time, state bytes per sequence and checkpoint overhead.","cc":["sequence.recurrent_execution"],"condition":"Recurrent or hybrid checkpoint","bindings":["sequence.recurrent_scan"],"target":false,"essential":false},{"id":"resid","group":"Decoder","title":"Gate the attention residual and prepare FFN input","detail":"Post-normalize the attention result. The learned residual gate mixes the prior stream with that branch using per-channel coefficients. Pre-normalize the resulting hidden rows for the FFN and its router. A fused kernel must preserve this ordering.","check":"Compare hidden tensors immediately before and after this join across multiple layers.","metric":"Residual read/write bytes and launches saved by legal fusion.","cc":["model.decoder_architecture"],"bindings":["model.hyper_connections","dense.rms_norm"],"target":true,"essential":true},{"id":"dense","group":"Feed-forward","title":"Compute dense FFN outputs","detail":"For a gated FFN, form gate and up projections, apply the declared activation to the gate, multiply elementwise, then down-project to hidden width. Ungated FFNs follow the model’s activation graph.","check":"Compare intermediate activations, biases and down-projection values to a small reference.","metric":"Prefill GEMM throughput versus decode weight bandwidth; scratch traffic.","cc":["dense.feed_forward"],"condition":"Dense FFN layer","bindings":["dense.gated_activation","dense.quantized_matmul"],"target":true,"essential":false},{"id":"gate","group":"MoE","title":"Compute unbiased routing scores","detail":"Project FFN input rows with the router matrix in the reference’s FP32 arithmetic. Multiply logits by output_multiplier, apply sigmoid and retain the resulting score for every token and expert.","check":"Construct a bias that changes the selected IDs without changing their unbiased mixture weights. Test hash-layer mapping separately.","metric":"Gate projection and transform time per token and layer.","cc":["model.expert_routing"],"bindings":["routing.hash_lookup"],"target":true,"essential":true},{"id":"route","group":"MoE","title":"Rank experts and gather mixture weights","detail":"Rank sigmoid scores plus the learned correction bias. Gather the original, unbiased sigmoid scores at the selected IDs, normalize by their selected sum plus epsilon, then apply routed_scaling_factor. The reference configuration defaults to eight routed picks; actual pack metadata determines k.","check":"Use a bias that changes membership but leaves gathered scores unbiased. Compare membership, ID/weight alignment and resulting expert mixture for the actual checkpoint k, including a tie at the cutoff.","metric":"Selection latency by expert count and k; optimized versus fallback dispatch.","cc":["model.expert_routing"],"bindings":["routing.top_k","routing.hash_lookup"],"target":true,"essential":true},{"id":"predict","group":"MoE","title":"Prefetch likely expert weights","detail":"If the target uses out-of-core storage, use features available before the authoritative route to issue bounded optional prefetch hints. Retain exact-demand loading and attribute benefit only to service time actually removed from the critical path.","check":"Force zero forecast accuracy and check identical selected IDs and model outputs. Score held-out actual demand.","metric":"Hint lead time, useful bytes prefetched, wasted transfer bytes and exposed wait saved.","cc":["routing.forecast_expert_demand"],"condition":"Streaming or offload benefits from advisory hints","bindings":["routing.predict_demand","verification.score_predictions"],"target":true,"essential":false},{"id":"ready","group":"MoE","title":"Wait for selected weight ranges","detail":"For an out-of-core target, resolve each demanded (layer, expert) to its packed gate, up and down tensors. On a miss, issue or join an exact fill, fence the transfer and pin its slot through the last read. Incorrect prefetch hints can delay a request but cannot change its expert IDs.","check":"Force a miss after a wrong hint, reorder IO completions and recycle a slot. Every consumed handle must match the demanded layer and expert.","metric":"Demand miss rate, transferred bytes, wait on the critical path and duplicate loads.","cc":["engine.expert_streaming"],"bindings":["engine.expert_streaming"],"condition":"Out-of-core target with expert weights that do not all fit in the fast tier.","target":true,"essential":true},{"id":"dispatch","group":"MoE","title":"Group token rows by selected expert","detail":"Map each authoritative (token, expert) pair to a local work row. Project the FFN input to expert width and apply pre-expert centered RMSNorm. Preserve the inverse row indices and aligned route weights. On a single host, this grouping can run without network exchange.","check":"Use empty and uneven expert groups with more than one assignment per token. Verify every grouped row maps back to the correct token, expert and route weight.","metric":"Local packing time, active rows per expert, imbalance and scratch bytes.","cc":["merge.expert_contributions","parallel.expert_exchange"],"bindings":["experts.pack_tokens","parallel.dispatch_experts"],"target":true,"essential":true},{"id":"expert","group":"MoE","title":"Compute and normalize each routed FFN","detail":"For each assigned expert compute SiLU(gate_proj(x)) × up_proj(x), then down-project. Apply the expert-output input-scaled RMSNorm before multiplying by the token’s routing weight. Quantized kernels must preserve the declared norm and accumulation boundaries.","check":"Compare each active group against a separate reference FFN, including one-row and empty groups.","metric":"Rows per expert, weight bandwidth in decode and grouped matmul utilization in prefill.","cc":["model.expert_ffn","backend.execute_operators"],"bindings":["experts.grouped_forward","cpu.schedule_experts"],"target":true,"essential":true},{"id":"shared","group":"MoE","title":"Shared FFN in other MoE models","detail":"The inspected SGLang Muse model rejects any nonzero num_shared_experts. Other model contracts can require an always-on expert and independent output gate. Keep that branch outside the active Muse execution path.","check":"Independently evaluate the shared output and gate for a token whose routed expert IDs exclude that branch.","metric":"Shared weight footprint, execution time and useful overlap with routed experts.","cc":["model.expert_ffn"],"condition":"Other model contracts only. Inactive for the audited Muse path.","bindings":["experts.shared_forward"],"target":false,"essential":false},{"id":"combine","group":"MoE","title":"Sum routed outputs and project to model width","detail":"Use the inverse assignment map to accumulate weighted, post-normalized expert outputs into the original token rows. Project the resulting expert-width sum back to model width. The audited Muse path combines routed contributions only.","check":"Compare to a direct per-token sum with uneven local expert loads, permuted rows and nonuniform weights. Check the expert-output norm precedes multiplication and the projection follows accumulation.","metric":"Local scatter and reduction bandwidth, accumulation error and post-projection time.","cc":["merge.expert_contributions","parallel.expert_exchange"],"bindings":["merge.expert_outputs","parallel.combine_experts"],"target":true,"essential":true},{"id":"layerout","group":"Decoder","title":"Apply the FFN residual gate","detail":"Post-normalize the FFN branch and combine it with the residual stream using the learned norm-preserving gate. Hand the stream to the next block’s pre-attention norm. After the last block, apply the configured final model norm.","check":"Capture layer-boundary hidden states and locate the first divergent layer against a reference.","metric":"Per-layer critical-path time and bytes retained between successive layers.","cc":["model.decoder_architecture"],"bindings":["model.decoder_stack","model.hyper_connections"],"target":true,"essential":true},{"id":"head","group":"Decoder","title":"Scale and softcap vocabulary logits","detail":"Apply the output projection to the requested hidden rows. The Muse reference scales logits by output_multiplier before applying the configured tanh softcap. Return the transformed vocabulary scores to sampling or draft verification.","check":"Compare full vocabulary logits for requested rows before sampling; exercise ties, output subsets and tensor-parallel gathering.","metric":"Logit rows computed, projection cost and vocabulary communication volume.","cc":["model.logit_head","parallel.model_execution"],"bindings":["output.project_logits"],"target":true,"essential":true}],"edges":[["embed","norm","hidden rows and residual"],["norm","qkv","normalized token rows"],["qkv","position","Q and K heads"],["qkv","kv","V heads"],["position","kv","positioned K"],["position","attend","positioned Q"],["kv","attend","KV descriptors and valid length"],["kv","shortlist","KV index entries"],["shortlist","attend","allowed candidate positions"],["attend","attout","weighted head outputs"],["norm","recur","hybrid layer input and position"],["recur","resid","recurrent output"],["attout","resid","projected attention rows"],["norm","resid","saved residual"],["resid","dense","dense-layer input"],["resid","gate","MoE-layer input"],["resid","shared","original hidden rows"],["gate","route","ranking and weighting scores or lookup"],["route","dispatch","selected IDs, weights and token positions"],["route","ready","authoritative weight demand"],["predict","ready","advisory hint only"],["dispatch","expert","expert-grouped token rows"],["ready","expert","ready weight handles"],["expert","combine","routed output and inverse map"],["shared","combine","shared contribution"],["combine","layerout","mixed hidden rows"],["dense","layerout","dense FFN output"],["layerout","norm","next block hidden rows"],["layerout","head","final normalized rows"]]},{"id":"backend","title":"L5 · Execution backend","summary":"Lower tensor operations to CPU or accelerator work. Select a kernel for the actual shape, dtype and layout, bind operand buffers, and return an event that tells the caller when results can be read.","ops":[{"id":"lower","group":"Planning","title":"Lower the operator graph","detail":"Bind concrete shapes, strides, dtypes, device placements and buffer aliases to executable operations. Derive read/write dependencies and lifetimes, including state updates and side effects.","check":"Compare graph outputs to eager execution with noncontiguous tensors, variable lengths and reused buffers.","metric":"Planning time, graph breaks and peak live temporary bytes.","cc":["graph.lower_capture_replay","backend.execute_operators"],"bindings":["graph.construct","graph.execute_forward"],"target":true,"essential":false},{"id":"dispatch","group":"Planning","title":"Choose a kernel for the operand layout","detail":"Check hardware features, alignment, head dimension, quantization type, batch shape and specialization bounds. Choose library, native or generated code and retain a valid fallback.","check":"Test just below, at and beyond specialization limits with unfavorable strides and partial tiles.","metric":"Selected implementation, dispatch overhead and fallback frequency by shape.","cc":["backend.execute_operators"],"bindings":["cuda.admit_router_kernel","attention.select_backend","cuda.dispatch_operator"],"target":true,"essential":true},{"id":"quant","group":"Kernel families","title":"Decode packed weight blocks","detail":"Extract low-bit fields using the declared packing, scale and zero or offset convention. Decode in a separate operator or inside a tile load according to reuse and available instructions.","check":"Compare signed edge cases, scales and all reconstructed lanes against an independent format-specific oracle.","metric":"Effective weight bytes read, unpack instructions and occupancy.","cc":["weights.decode_blocks","weights.prepare_artifact","backend.execute_operators"],"bindings":["weights.unpack_blocks","weights.repack_for_kernel"],"target":true,"essential":false},{"id":"gemm","group":"Kernel families","title":"Tile GEMM and GEMV","detail":"Choose output tiling, packed loads, register/shared-memory staging, vector or matrix instructions and accumulation dtype. Prefill often supplies many rows per weight tile; decode or a sparse expert can supply one.","check":"Test M/N/K tails, misalignment, nonzero leading strides, accumulation error and grouped expert offsets.","metric":"Achieved FLOP/s and DRAM bytes/s by M,N,K; register pressure and tile occupancy.","cc":["backend.execute_operators","dense.feed_forward","model.expert_ffn"],"bindings":["dense.quantized_matmul","experts.grouped_forward"],"target":true,"essential":true},{"id":"attn","group":"Kernel families","title":"Run attention kernels","detail":"Use the batch’s sequence lengths, KV-head grouping, positions and cache layout. Tile Q/K/V, merge per-tile max/sum/output consistently and dispatch suitable prefill or decode kernels.","check":"Compare tiled and split reductions with stable reference softmax on ragged batches, long contexts and partial KV blocks.","metric":"Effective KV bandwidth, prefill arithmetic throughput and scratch bytes.","cc":["attention.dense_execution","attention.sparse_execution","backend.execute_operators"],"bindings":["attention.flash_attention","attention.merge_partials"],"target":true,"essential":true},{"id":"row","group":"Kernel families","title":"Run reductions and indexed copies","detail":"Implement row reductions and movement for norms, router top-k, sampling, expert counts, prefix sums, packing and output mixing. Preserve tie policy, inverse indices, aliasing constraints and reduction precision.","check":"Use ties at kth rank, all-zero rows, uneven group sizes and counts spanning a warp or block boundary.","metric":"Launch count, memory traffic, reduction throughput and synchronization cost.","cc":["backend.execute_operators","model.expert_routing","merge.expert_contributions","model.decoder_architecture"],"bindings":["cuda.launch_router","graph.fuse_routing"],"target":true,"essential":true},{"id":"streams","group":"Submission","title":"Schedule copies and kernel launches","detail":"Enqueue copies, collectives and compute on suitable streams. Record/wait events at true producer-consumer dependencies; pin buffers until final read completes.","check":"Delay copies and cross-stream producers. Compare asynchronous execution with a serialized reference and test cancellation during flight.","metric":"Exposed copy or collective wait versus overlapped duration; launch gaps.","cc":["backend.execute_operators","memory.runtime_arenas","parallel.model_execution"],"bindings":["transfer.copy_tensor","parallel.peer_transport"],"target":true,"essential":true},{"id":"capture","group":"Submission","title":"Capture or replay graph","detail":"For stable shapes and addresses, record a CUDA graph or equivalent backend executable. Update only parameters supported by the backend. Rebuild or take an eager path on incompatible shape, pointer or control flow.","check":"Alternate captured shapes and forced fallback; change buffers and verify that graph replay never reads stale storage.","metric":"Capture cost, replay hit rate, host submission latency and warm-up time.","cc":["graph.lower_capture_replay"],"condition":"Graph-capable backend and stable execution segment","bindings":["graph.capture_replay"],"target":true,"essential":false},{"id":"cpu","group":"Submission","title":"Run host kernels and workers","detail":"Schedule CPU work with suitable ISA, affinity and thread-pool width. For heterogeneous expert execution, coordinate worker completion and handle an idle pool without excessive spinning.","check":"Compare scalar and vector paths, isolate worker lifetimes and exercise idle-to-busy transitions and pool shutdown.","metric":"Host cycles/token, runnable workers, wake latency and memory bandwidth.","cc":["backend.execute_operators"],"bindings":["cpu.execute_graph","cpu.schedule_experts"],"target":true,"essential":false},{"id":"signal","group":"Submission","title":"Signal device or CPU completion","detail":"Return completion and device error information with request, batch and operation IDs. Runtime markers connect submitted operations to device intervals and preserve asynchronous attribution.","check":"Correlate a known delayed kernel with its owning batch and verify incomplete work cannot release resources.","metric":"Submission-to-start gap, completion-to-next-submit gap and timeline coverage.","cc":["observability.runtime_events","backend.execute_operators"],"bindings":["observability.request_timing"],"target":true,"essential":true}],"edges":[["lower","dispatch","shape, dtype, layout and dependencies"],["dispatch","quant","packed format descriptor"],["dispatch","gemm","matmul implementation"],["dispatch","attn","attention kernel and launch shape"],["dispatch","row","reduction or movement kernel"],["dispatch","cpu","host operator and work range"],["quant","gemm","decoded tile or unpacked weights"],["gemm","streams","matmul launch descriptor"],["attn","streams","attention launch descriptor"],["row","streams","reduction launch descriptor"],["streams","capture","eligible stable launch sequence"],["capture","signal","replay completion"],["streams","signal","device events and errors"],["cpu","signal","worker completion"]]},{"id":"state","title":"M · Memory and state","summary":"Manage storage shared by startup, scheduling, model execution and kernels. Weight handles persist with the model, KV follows a sequence, and scratch becomes reusable after its last reader finishes.","ops":[{"id":"weight","group":"Parameters","title":"Bind weight storage to tensor handles","detail":"Retain bound read-only weight storage or mapped ranges for the model lifetime. Associate each pointer with tensor shape, dtype, quantization metadata, placement and ownership on load or eviction.","check":"Hash or decode sampled weight slices across reloads, tiers and device views.","metric":"Mapped versus resident bytes, page faults and bytes read from each tier.","cc":["weights.load_checkpoint","placement.partition_model"],"bindings":["placement.map_weights","weights.bind_tensors"],"target":true,"essential":true},{"id":"residency","group":"Parameters","title":"Budget fast-tier expert weights","detail":"Subtract persistent dense weights, KV, execution workspace and runtime headroom from the usable physical target budget. Use measured bytes in the chosen Muse pack for each expert range, including scales and padding. Shared system memory must be counted once across CPU and accelerator.","check":"Replay a demand set larger than the cache, verify evictions, check host and device peaks, and reject startup when even the minimum execution tile and state cannot fit.","metric":"Useful resident fraction, demand miss ratio, eviction churn and high-water bytes.","cc":["engine.expert_streaming"],"bindings":["placement.map_expert_replicas"],"target":true,"essential":true},{"id":"fill","group":"Parameters","title":"Load and pin expert weight ranges","detail":"For out-of-core Muse execution, resolve the selected expert’s packed ranges from storage into bounded slots. Coalesce identical in-flight requests, wait for complete bytes and pin the generation until all assigned rows finish. This path needs a target-specific implementation and qualification.","check":"Simulate overlapping hint/demand fills, delayed IO and slot reuse and compare the actual consumed bytes.","metric":"Demand wait, speculative bytes wasted, duplicate reads and transfer overlap.","cc":["engine.expert_streaming"],"bindings":["engine.expert_streaming"],"target":true,"essential":true},{"id":"allocate","group":"Sequence state","title":"Reserve KV pages or contiguous slots","detail":"Reserve per-sequence cache pages or contiguous slots before execution. Distinguish logical position, physical page/offset and allocation generation. For standard dense KV, a baseline payload estimate is 2 × layers × tokens × KV heads × head dimension × bytes/element when K and V shapes match.","check":"Test page-boundary allocation, short final pages and out-of-capacity rollback; account separately for slack, metadata and alternative cache layouts.","metric":"Active KV payload, allocated bytes, fragmentation and remaining token capacity.","cc":["memory.sequence_kv"],"bindings":["memory.kv_slots"],"target":true,"essential":true},{"id":"append","group":"Sequence state","title":"Write and read sequence KV","detail":"The model appends K/V for the current sequence positions; attention reads the allowed prefix using descriptors from the allocator. Windowed, quantized or compressed layouts require corresponding index and decode semantics.","check":"Compare a cached continuation to full recomputation after a page transition, context wrap or cache-format conversion.","metric":"Read and write bytes per decode token, lookup cost and cache precision error.","cc":["memory.sequence_kv"],"bindings":["memory.windowed_kv","memory.encode_kv"],"target":true,"essential":true},{"id":"reuse","group":"Sequence state","title":"Match and share prefixes","detail":"Index only compatible prefixes, including model/adapter and positional context that affect state. Share immutable full spans and use copy-on-write or exclusive ownership when appending.","check":"Branch two requests from one prefix, append different tokens and verify isolation; check a tokenizer or adapter mismatch misses.","metric":"Hit rate by reusable tokens, saved prefill work and eviction pressure.","cc":["memory.reusable_sessions"],"condition":"Prefix or session reuse enabled","bindings":["memory.match_prefix","memory.evict_prefix"],"target":true,"essential":false},{"id":"tier","group":"Sequence state","title":"Move or restore state","detail":"When memory pressure or worker transfer requires it, preserve logical ownership while moving sealed pages or snapshots. Publish destination page tables after bytes and completion generation match.","check":"Restore at a partially filled page, introduce a delayed copy and verify resumed logits versus uninterrupted execution.","metric":"Moved KV bytes, restore stall, migration latency and regained capacity.","cc":["memory.sequence_kv","parallel.model_execution"],"condition":"KV offload, migration or disaggregation","bindings":["memory.tier_kv","transfer.copy_kv_pages"],"target":true,"essential":false},{"id":"recurrent","group":"Sequence state","title":"Save recurrent and speculative state","detail":"Bind recurrent hidden state, counters and speculative checkpoints to each request and layer. Snapshot enough to undo rejected tokens or safely recompute that segment.","check":"Branch, reject and resume at different acceptance lengths. Compare resulting state to serial target execution.","metric":"State and snapshot bytes/sequence; restoration or recomputation cost.","cc":["sequence.recurrent_execution","decode.speculative_execution"],"condition":"Hybrid recurrence or speculative state","bindings":["sequence.recurrent_state","memory.snapshot_session"],"target":false,"essential":false},{"id":"scratch","group":"Transient","title":"Allocate temporary workspace","detail":"Plan activation, quantization, communication and kernel scratch by liveness, alignment and device. Reuse memory once its final asynchronous consumer completes.","check":"Poison released buffers under interleaved streams and compare outputs at peak simultaneous batch size.","metric":"Peak live/allocated bytes, allocator time and fragmentation.","cc":["memory.runtime_arenas"],"bindings":["memory.plan_workspace","memory.pinned_arena","memory.virtual_device_arena"],"target":true,"essential":true},{"id":"release","group":"Transient","title":"Release storage after its last reader","detail":"Use completion fences and ownership counts to release physical resources after cancellation, request completion, speculative rollback or model shutdown. Keep intentionally retained prefix entries accounted.","check":"Repeatedly cancel and reuse slots while kernels run. Check bounded memory growth and correct isolation.","metric":"Outstanding retained bytes, release latency and free capacity after repeated runs.","cc":["memory.sequence_kv","memory.reusable_sessions","memory.runtime_arenas"],"bindings":["memory.evict_prefix","scheduler.retire_requests"],"target":true,"essential":true}],"edges":[["weight","residency","eligible expert weight ranges"],["residency","fill","budget and eviction decision"],["allocate","append","physical page table and valid length"],["append","reuse","shareable committed prefix"],["reuse","allocate","referenced prefix plus new writable capacity"],["append","tier","sealed pages and metadata"],["tier","append","ready destination handles"],["append","release","completed sequence references"],["recurrent","release","retired snapshot references"],["scratch","release","last-use completion"],["fill","release","consumer completion and slot generation"]]},{"id":"host","title":"L6 · Host and devices","summary":"The machine supplies CPU cores, accelerator compute, memory, links, storage and drivers. Startup reads their usable capacities and features. Running kernels, transfers and worker threads consume those resources.","ops":[{"id":"discover","group":"Platform","title":"Discover target capabilities","detail":"Read driver/runtime ABI, device features, available capacity, NUMA topology, supported instructions and accessible peers. Feed usable limits to startup rather than assuming all GPUs or memory tiers behave alike.","check":"Compare reported properties with successful allocation, operator launch and peer-access probes.","metric":"Usable capacity, supported capability set and cold initialization latency.","cc":["backend.execute_operators","placement.partition_model"],"bindings":["backend.register","parallel.establish_topology"],"target":true,"essential":false},{"id":"hostcpu","group":"Compute","title":"Schedule and run host threads","detail":"Host threads tokenize, schedule and launch device work; CPU kernels may also execute model operators. Available cores, affinity, OS scheduling and competing load constrain their latency.","check":"Run matched workloads with fixed worker count and record scheduling delay separately from active computation.","metric":"CPU cycles/token, context switches, run-queue wait and runnable cores.","cc":[],"target":true,"essential":true},{"id":"device","group":"Compute","title":"Execute accelerator kernels","detail":"Device compute units execute the admitted kernel instructions. Precision support, vector or tensor units, shared memory, cache and register limits constrain efficient shapes.","check":"Record device identity and clocks for each run. Compare a measured kernel with a matched precision and shape ceiling.","metric":"Achieved FLOP/s, achieved bandwidth, active warps and stall reasons.","cc":[],"target":true,"essential":true},{"id":"dram","group":"Memory system","title":"Move bytes through memory and links","detail":"Physical bandwidth depends on topology: unified versus discrete memory, NUMA locality, accelerator links and peer routing. Explicit copies and shared-address accesses can have distinct costs.","check":"Measure the actual access path and payload size for local, remote and peer cases under the target topology.","metric":"Sustained GB/s, latency by transfer size and traffic per interconnect.","cc":[],"target":true,"essential":true},{"id":"ssd","group":"Memory system","title":"Read weights from storage","detail":"Checkpoint reads and streamed experts may traverse filesystem cache, mapped pages, direct IO or a remote store. Distinguish storage service time from page faults and cache hits.","check":"Repeat a known byte-range workload with documented cold/warm cache state, read alignment and concurrency.","metric":"Read latency percentiles, queue depth, bandwidth and page-fault count.","cc":[],"target":true,"essential":true},{"id":"observe","group":"Platform","title":"Report device health","detail":"Collect available clocks, thermal throttling, power or memory pressure counters with the workload timeline. Label unsupported counters and the collection method.","check":"Induce a known load change and verify timestamps and units, including device counters reported as unavailable.","metric":"Sustained clocks, thermal events, reclaim activity and sample interval.","cc":["observability.runtime_events"],"bindings":["observability.request_timing"],"target":true,"essential":false}],"edges":[["discover","hostcpu","visible core and NUMA topology"],["discover","device","device and driver capabilities"],["discover","dram","available memory tiers and links"],["discover","ssd","storage access paths"],["hostcpu","device","driver submission"],["ssd","dram","weight bytes via IO or mapping"],["dram","device","operator operands and result storage"],["device","observe","device counters"],["hostcpu","observe","host counters"]]}],"factory":[{"id":"f_spec","title":"Intent and contract","summary":"The Intent Compiler captures the user request in a reviewed brief. The Contract Compiler consumes that brief and the system ontology to define model behavior, resource limits and acceptance tests.","ops":[{"id":"intake","title":"Capture intent","detail":"Identify the requested model and revision, target topology, serving mode, context and concurrency range, memory limit, allowed dependencies and success criteria. Keep user preferences separate from facts observed on the machine.","check":"Flag missing facts that change feasibility. Preserve the exact request and evidence for resolved facts.","metric":"Unresolved contract-changing questions.","cc":["compiler.intent_brief"],"target":true,"essential":true},{"id":"modelterms","title":"Bind contract terms to model behavior","detail":"Bind words such as “five experts plus one shared” to routed width, independent shared tensors, score transformation, normalization and the checkpoint’s architecture. Check tokenizer identity and vocabulary boundaries.","check":"Reject an unsupported checkpoint change before planning. Record which settings can vary at runtime.","metric":"Unbound model fields and contradictory settings.","cc":["compiler.engine_contract"],"target":true,"essential":true},{"id":"budget","title":"Set target budgets","detail":"Attach units, measurement boundaries and workload shapes to VRAM or shared-memory ceilings, TTFT, inter-token latency, throughput and quality. Distinguish a microkernel target from a user-visible SLO.","check":"A reviewer can run the acceptance rule from its workload, metric and threshold.","metric":"Acceptance measures with a defined workload and denominator.","cc":["compiler.engine_contract"],"target":true,"essential":true},{"id":"freeze","title":"Freeze the contract","detail":"Release the contract revision with the ontology, required interfaces, allowed substitutions, independent oracle and pass/fail gates. Bind supplier commitments for weights, tokenizer, SDK and runtime dependencies.","check":"Changing routing semantics or relaxing quality opens a contract revision. An equivalent backend choice stays inside the authorized design space.","metric":"Contracts with identified asset suppliers and acceptance gates.","cc":["compiler.engine_contract"],"target":true,"essential":tru function drawAtlas(container, options) {
  const ns = 'http://www.w3.org/2000/svg';
  const { layers, mode, onLayer, onOp, onRole, onEdge } = options;
  const idOf = value => typeof value === 'string' ? value : value?.id;
  const selectedLayer = layers.find(x => x.id === idOf(options.layer));
  const selectedOp = selectedLayer?.ops.find(x => x.id === idOf(options.op));
  const groupNames = [...new Set(selectedLayer?.ops.map(o=>o.group).filter(Boolean) || [])];
  const activeGroup = selectedOp?.group || (groupNames.includes(options.group) ? options.group : '');
  const groupKey = g => '@group/'+g;
  const openGroup = group => options.onGroup ? options.onGroup(selectedLayer.id,group) : drawAtlas(container,{...options,op:'',role:'',group});
  const selectedRole = idOf(options.role);
  const uid = 'ax' + (drawAtlas.serial = (drawAtlas.serial || 0) + 1);
  const trace = options.trace || {};
  const traced = new Set(Array.isArray(trace) || trace instanceof Set ? trace : [...(trace.layers || []), ...(trace.ops || [])]);
  const tracedEdges = new Set((Array.isArray(trace.edges) ? trace.edges : []).map(e => e.slice(0, 2).join('|')));
  const html = (tag, cls, text) => {
    const el = document.createElement(tag);
    if (cls) el.className = cls;
    if (text !== undefined) el.textContent = text;
    return el;
  };
  const svgEl = (parent, tag, attrs = {}, text) => {
    const el = document.createElementNS(ns, tag);
    for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
    if (text !== undefined) el.textContent = text;
    parent.append(el);
    return el;
  };
  const button = (parent, text, action, cls) => {
    const b = html('button', cls || '', text);

function quantization(){

 '<div class="sheet"><h2>Muse checkpoints</h2><p>Meta lists BF16 at about 1.65 TB and NVFP4 at about 537 GB. NVFP4 retains some BF16 layers. Both published weight footprints exceed the target’s 128 GB unified memory, before KV state, staging and workspace. Smaller expert blocks can reduce bytes per miss and fit more experts in cache. Actual latency also depends on the selected kernel and the conversion cost.</p>'+ext('Meta checkpoint formats and footprints','https://dev.meta.ai/docs/muse-spark-open/get-the-model')+
 '<p>The pinned SGLang Muse implementation selects distinct NVFP4 and GPTQ INT4 expert paths. This supports treating the packed layout and kernel as a pair. A compatible reference implementation is evidence for the job; each proposed pack and kernel still needs qualification on the DGX Spark.</p>'+ext('Muse expert implementation selection',sglMuse+'#L576')+'</div>'+
 '<div class="quant-steps">'+[
 ['1 · Specify the comparison','Freeze the base model and tokenizer, candidate tensor formats and exceptions, packing and scale conventions, weight versus activation and KV precision, calibration data identity if applicable, target build and acceptance gates. Change one factor initially.',jump('compiler.engine_contract','Freeze the contract')],

 '<div class="sheet"><h2>Control skipped experts</h2><p>In the inspected Strata verify path, a selected expert can miss the cache and have its contribution zeroed under a tail-skip policy. Its default depends on the weight format and cache residency. Changing packs can therefore change two variables in one trial. For an exact-demand comparison, set <code>STRATA_ROUTE_TAIL_SKIP=0</code> in both Strata runs. Record selected, executed and skipped assignments beside the quality score. Evaluate skipping as its own trial if the contract permits it.</p>'+ext('Strata policy and format gates','https://github.com/Niko1221/Strata/blob/c77572806996349b49995e4f98d41b5294d36a21/src/program/generate.cpp#L13817')+' · '+ext('Skipped contribution in dispatch','https://github.com/Niko1221/Strata/blob/c77572806996349b49995e4f98d41b5294d36a21/src/core/expert_source.cpp#L5307')+'</div>'+

 '<section class="sheet"><h2>Shared trial conditions</h2><p>One Spark, one model, weights larger than usable unified memory. Freeze the image, pack, tokenized prompts, context, sampling and memory ceiling except for the variable under test. Include OS, KV, staging and scratch in peak memory. Separate warm process cache from warm filesystem cache and cold SSD reads. Report actual device I/O alongside logical bytes requested.</p><p>Set the minimum worthwhile improvement, quality tolerance and memory limit in the contract before testing. Alternate paired baseline and candidate runs. Advance only when repeated measurements clear the agreed gate; an interval spanning that gate is inconclusive. Timing and quality here are proposed tests.</p>'+link('compiler.engine_contract')+' '+link('factory.controlled_experiment')+'</section>'+

    const trial=sparkTrials.find(t=>t.title===card.title);

      card.audit ? '<span class="proof-chip single">One-engine evidence · '+esc(card.audit)+'</span>' : '';

      '<p><strong>Acceptance</strong> · '+esc(card.check)+'</p></details></article>';
  }
  const active=atlas.roles.filter(r=>r.target && r.kind!=='factory');
  const common=active.filter(r=>engines.every(engine=>r.examples.some(x=>x.engine===engine)));
  return '<section id="variations-section"><h2>Which features fit together?</h2><p class="lead">'+common.length+' of '+active.length+' target engine CCs have source examples in all four engines. One codebase can support many variants. The checkpoint fixes the required computation, and the planner qualifies each enabled combination within the single-Spark budget.</p>'+
    '<div class="comparison-key">'+groups.map(([key,title])=>'<span class="cmp-tag cmp-'+key+'">'+esc(title)+'</span>').join('')+'</div>'+
    '<p class="caption">Purple marks a mechanism verified in one audited engine. Pink marks a published research method whose integration in these four engines is unverified. Both labels describe evidence coverage.</p>'+
    '<section class="sheet"><h2>Out-of-core MoE experiments</h2><p>Each candidate has an owning CC, a baseline, a test on one Spark and a build decision.</p><div class="pills">'+sparkTrials.map(t=>'<a class="proof-chip '+(t.badge==='research'?'paper':'single')+'" href="#construction/trial-'+t.id+'">'+esc(t.title)+'</a>').join(' ')+'</div><p>'+pill('Read all eight experiments','#construction/trials')+'</p></section>'+
    groups.map(([key,title,detail])=>'<section class="comparison-group cmp-'+key+'"><h2>'+esc(title)+'</h2><p>'+esc(detail)+'</p><div class="cards">'+cards.filter(card=>card.group===key).map(showCard).join('')+'</div></section>').join('')+'</section>';
}

 const matchEnd=(actual,shown)=>actual===shown||('@group/'+(layer?.ops.find(x=>x.id===actual)?.group||''))===shown;
 const members=selected&&layer?layer.edges.filter(([a,b])=>matchEnd(a,selected[0])&&matchEnd(b,selected[1])):[];
 const edgeNote=selected?.length===3?'<section class="insight"><b>Handoff · '+esc(selected[2])+'</b><p>'+esc(endpointTitle(selected[0]))+' → '+esc(endpointTitle(selected[1]))+'</p>'+members.filter(e=>e[0]!==selected[0]||e[1]!==selected[1]).map(([a,b,l])=>'<p>'+pill(endpointTitle(a),at(layer.id,a,opts))+' → '+pill(endpointTitle(b),at(layer.id,b,opts))+' · '+esc(l)+'</p>').join('')+'</section>':'';
 const summary=mode==='engine'?'Text generation on one 128 GB DGX Spark. The model exceeds unified memory. Follow a routed token to its expert weights on storage, or open a subsystem to see which CCs own its operations.':'The planner assigns work orders and CCs to agents. Each CC bundles capabilities the agent can use. Follow the artifacts from the contract to the verified image.';
 const engineSummary='<h2>Engine image interface</h2><p>Clients send completions requests to the published port. The launcher binds model and output volumes. Profilers observe optional runtime annotations through the declared capture controls.</p><div class="pills">'+pill('Interface owner','#cc/serving.request_gateway')+' '+pill('Volume mounts',at('interface','mounts'))+' '+pill('Diagnostic hooks',at('interface','diagnostics'))+'</div><h2>Request execution</h2><p>Read down for execution. The memory column shows state shared across calls. The host supplies compute, storage and transfers outside the image.</p>'+sec('Prefill and decode',list('Prefill processes a prompt span and establishes sequence state. Decode usually advances one committed token per sequence and reads its retained KV. Both invoke the same model with different shapes.'))+sec('Routed weights',list('The router owns the expert IDs and mixture weights. Residency and streaming determine when the selected weights are ready. A prediction can start a fetch, but only the authoritative route decides which outputs to combine.'))+sec('Inspect on graph',pill('Token admission',at('schedule','admit',opts))+' '+pill('Expert routing',at('model','route',opts))+' '+pill('Kernel dispatch',at('backend','dispatch',opts)));
 const factoryOwners=[['compiler.intent_brief','Intent Compiler · Capture the request and release a reviewed intent brief.'],['compiler.engine_contract','Contract Compiler · Turn the reviewed brief into a testable contract.'],['factory.workflow_planning','Inspect gaps and issue work orders.'],['factory.source_integration','Produce a reviewable repository diff.'],['factory.builder','Build an image with the executable and its dependencies.'],['factory.controlled_experiment','Turn a pinned image and test question into a scoped verdict.']].map(([key,job])=>'<p>'+pill(key,'#cc/'+key)+' '+esc(job)+'</p>').join('');
 const factorySummary='<h2>Six factory CCs</h2>'+pill('M1 and dynamic workflow integration','#integration')+factoryOwners+receiptGuide()+'<p>The workflow establishes order, dependencies and retry conditions. A CC supplies a reusable engineering job for an agent. Each agent can receive several CCs, and several agents can use the same CC on different work orders.</p>'+pill('Example agent assignments',at('f_plan','workorder',opts))+sec('Empty source tree',list('Bind the checkpoint, tokenizer, target and acceptance cases. Assign the missing operations, establish a reference forward pass, boot the image and replay a frozen request.'))+sec('Existing engine',list('Inspect the actual interface and qualify it first. Assign the unmet contract obligations to agents, then repeat the same acceptance cases.'));
 root.innerHTML='<h1>'+overview+'</h1><p class="lead">'+summary+'</p><div class="tools">'+pill('Build from scratch','#construction')+pill('Spark experiments','#construction/trials')+atlas.traces.filter(t=>['token','moe','miss'].includes(t.id)).map(t=>'<a class="pill" data-walk="'+t.id+'" href="'+esc(traceHref(t,0))+'">'+esc(t.title)+'</a>').join('')+'</div><details class="corekey"><summary><span>◆ Essential</span> · ◇ Contains essential operations</summary><p>'+esc(atlas.baseline)+' Unmarked jobs can become required under a different contract.</p></details>'+walk+
 (layer?'<div class="crumb">'+pill(overview,address(mode,'',opts))+(layer?' › '+pill(layer.title,address(mode,layer.id,opts)):'')+(op?' › '+pill(op.title,at(layer.id,op.id,opts)):'')+(role?' › '+esc(role.id):'')+'</div>':'')+'<div class="cols"><div class="graphwrap"><div id="graph"></div></div><aside class="sheet" id="inspector">'+edgeNote+(role?ccPanel(role,overlay):op?opPanel(layer,op,overlay):layer?'<div class="tagline">Subsystem</div><h2>'+esc(layer.title)+'</h2>'+list(layer.summary)+sec('Operations',layer.ops.map(o=>pill(o.title,at(layer.id,o.id,opts))).join(' ')):mode==='engine'?engineSummary:factorySummary)+'</aside></div>';
 drawAtlas(document.querySelector('#graph'),{layers,edges,layer,op,role,roles:roleIndex,mode,overlay,bindings:[],cross:atlas.cross,group:p.get('group'),onGroup:(l,g)=>set(address(mode,l,{...opts,group:g})),trace:tr?{layers:tr.steps.map(s=>s[0]),ops:[tr.steps[idx][1]]}:null,
 onLayer:l=>set(address(mode,l,opts)),onOp:(l,o)=>set(at(l,o,opts)),onRole:(k,l,o)=>{const place=layer?.ops.find(v=>v.id===(o||op?.id)&&v.cc.includes(k))||layer?.ops.find(v=>v.cc.includes(k));if(place)set(at(l||layer.id,place.id,{cc:k,...(tr&&place.id===op?.id?{trace:tr.id,step:idx}:{})}))},
 onEdge:(a,b,l)=>{if(!edgeRows.some(e=>e[0]===a&&e[1]===b&&e[2]===l)){if(roleIndex.has(b)){const from=layer?.ops.find(o=>o.id===a&&o.cc.includes(b))||layer?.ops.find(o=>o.cc.includes(b));if(from)set(at(layer.id,from.id,{cc:b}));return}}
 set(address(mode,layer?.id,{...opts,op:op?.id,group:p.get('group'),edge:[a,b,l].join('|')}))}});
 if(wasGraph){const targetId=role?.id||op?.id;
 const target=targetId?Array.from(root.querySelectorAll('#graph [data-ax-id]')).find(n=>n.dataset.axId===targetId):root.querySelector('#graph button, #graph [tabindex="0"]');target?.focus({preventScroll:true})}
 if(role&&innerWidth<=980){const panel=root.querySelector('#inspector');panel.tabIndex=-1;panel.focus({preventScroll:true});panel.scrollIntoView({block:'start'})}
 updateRouting();
}
// Preserve the entry being left so browser Back restores this diagram or filtered list.
const backButton=document.querySelector('#page-back');
let depth=history.state?.atlasDepth||0;
function rememberView(){
 const opened=[...root.querySelectorAll('details')].map((d,i)=>d.open?i:-1).filter(i=>i>=0);
 history.replaceState({...history.state,atlasDepth:depth,atlasView:{y:scrollY,opened}},'');
}
function navigate(){
 const saved=history.state?.atlasView;
 depth=history.state?.atlasDepth??depth+1;
 history.replaceState({...history.state,atlasDepth:depth},'');
 backButton.disabled=depth===0;
 render();
 if(saved){const ds=root.querySelectorAll('details');for(const i of saved.opened)if(ds[i])ds[i].open=true;requestAnimationFrame(()=>window.scrollTo(0,saved.y))}
 else if(innerWidth>980 || !root.querySelector('#inspector code'))window.scrollTo(0,0);
}
document.addEventListener('click',rememberView,true);
document.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')rememberView()},true);
backButton.onclick=()=>{if(depth>0)history.back()};
history.replaceState({...history.state,atlasDepth:depth},'');
window.addEventListener('hashchange',navigate);navigate();
</script></body></html>
